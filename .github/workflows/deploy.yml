name: Deploy notes site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: notes
      - uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4.4.0
          path: quartz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: quartz
      - run: bash notes/.github/site/build.sh notes quartz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
